code: de

numbers:
  decimal_separator: ","
  overrides: {}
  ones:
    0: "null"
    1: "eins"
    2: "zwei"
    3: "drei"
    4: "vier"
    5: "fünf"
    6: "sechs"
    7: "sieben"
    8: "acht"
    9: "neun"
    10: "zehn"
    11: "elf"
    12: "zwölf"
    13: "dreizehn"
    14: "vierzehn"
    15: "fünfzehn"
    16: "sechzehn"
    17: "siebzehn"
    18: "achtzehn"
    19: "neunzehn"
  tens:
    20: "zwanzig"
    30: "dreißig"
    40: "vierzig"
    50: "fünfzig"
  compound:
    order: ones_tens
    separator: "und"
    ones_overrides:
      1: "ein"
  context_overrides:
    hour:
      1: "ein"

time:
  hour_mode: 24
  exact_hour: "{hour} Uhr"
  with_minutes: "{hour} Uhr {minute}"
  minute_prefix_under_ten: ""

date:
  pattern: "{day}. {month} {year}"
  months:
    - Januar
    - Februar
    - März
    - April
    - Mai
    - Juni
    - Juli
    - August
    - September
    - Oktober
    - November
    - Dezember

