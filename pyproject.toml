[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "weatherbox"
version = "0.1.0"
description = "Scheduled, location-aware weather announcement asset generator"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Weatherbox contributors" }]
dependencies = [
    "PyYAML>=6.0.2",
    "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0"]

[project.scripts]
wb-announcer = "weatherbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
