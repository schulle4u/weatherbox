# Copy to docker-config/config.yaml in the repository root.
application:
  log_level: INFO
  json_logs: true

localization:
  default_language: de
  # directory: lang

weather:
  providers:
    open-meteo: {}
  update_interval_minutes: 30
  max_cache_age_minutes: 60
  request_timeout_seconds: 15

scheduler:
  preparation_minutes: 10
  retry:
    interval_seconds: 60
    max_attempts: 5

tts:
  provider: gtts
  fallback_provider: espeak-ng
  gtts:
    language: de
    tld: de
    timeout_seconds: 15
  espeak-ng:
    voice: de
    speed: 155
  # Requires a build with INSTALL_PIPER=true and both .onnx and .onnx.json files.
  # piper:
  #   model: models/de_DE-thorsten-medium.onnx

audio:
  enabled: true
  loudness:
    enabled: true
  output:
    sample_rate: 48000
    channels: 2
    formats:
      mp3:
        bitrate: 192k
  # Optional audio files are relative to /etc/weatherbox inside the container.
  # jingles:
  #   half_hour:
  #     intro: assets/intro.wav

output:
  cache_dir: /var/lib/weatherbox/cache
  generated_dir: /var/lib/weatherbox/generated
  generated_retention_days: 30
  public_dir: /var/lib/weatherbox/public
  state_dir: /var/lib/weatherbox/state

# To generate static HTML without speech, set audio.enabled to false and enable:
# text:
#   enabled: true
# A custom template can be mounted below /etc/weatherbox and selected with
# template: /etc/weatherbox/template.html

announcements:
  half_hour:
    enabled: true
    template: >
      Es ist {time}. Hier ist das aktuelle Wetter für {location}.
      Die Temperatur beträgt {temperature} Grad. {weather_description}.
  full_hour:
    enabled: true
    template: >
      Es ist {time} in {location}. {day_weather_summary}
      {day_cloud_summary} {day_precipitation_summary}

locations:
  wittstock:
    name: Wittstock
    latitude: 53.16
    longitude: 12.48
    timezone: Europe/Berlin
    temperature_unit: c
    language: de
    enabled: true
