application:
  log_level: INFO
  json_logs: false

localization:
  default_language: de
  # Optionales Verzeichnis mit eigenen oder überschriebenen Sprachdateien.
  # Relative Pfade werden relativ zu dieser Konfigurationsdatei aufgelöst.
  # directory: lang

weather:
  providers:
    open-meteo:
      endpoint: https://api.open-meteo.com/v1/forecast
    dwd:
      endpoint: https://app-prod-ws.warnwetter.de/v30/stationOverviewExtended
  update_interval_minutes: 30
  max_cache_age_minutes: 60
  request_timeout_seconds: 15
  merge:
    tolerance_minutes: 30
    default_priority: [open-meteo, dwd]
    field_priority:
      temperature: [dwd, open-meteo]
      humidity: [dwd, open-meteo]
      pressure: [dwd, open-meteo]
      warnings: [dwd, open-meteo]

scheduler:
  preparation_minutes: 10
  retry:
    interval_seconds: 60
    max_attempts: 5

tts:
  # Cloud-Ausgabe per gTTS mit lokalem Piper-Fallback. Alternativ sind auch
  # piper und espeak-ng als primärer oder sekundärer Provider möglich.
  provider: gtts
  fallback_provider: piper
  gtts:
    language: de
    tld: de
    slow: false
    timeout_seconds: 15
  piper:
    executable: piper
    model: models/de_DE-kerstin-low.onnx
  espeak-ng:
    executable: espeak-ng
    voice: de
    speed: 155
  # Optionale Modelle und Stimmen je Sprache. Nicht angegebene Werte verwenden
  # die obigen Standardeinstellungen.
  # languages:
  #   en:
  #     piper:
  #       model: models/en_GB-alba-medium.onnx
  #     espeak-ng:
  #       voice: en-gb
  #     gtts:
  #       language: en
  #       tld: co.uk

audio:
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  loudness:
    enabled: true
    target_lufs: -16
    true_peak_db: -1.5
    loudness_range: 11
  output:
    format: mp3
    sample_rate: 48000
    channels: 2
    bitrate: 192k
  jingles:
    # Relative Pfade werden relativ zu dieser Konfigurationsdatei aufgelöst.
    half_hour: assets/jingle-short.wav
    full_hour: assets/jingle-full.wav

output:
  cache_dir: var/cache
  generated_dir: var/generated
  public_dir: var/public
  state_dir: var/state

# Ansagen können je Standort vollständig überschrieben werden.
announcements:
  half_hour:
    enabled: true
    template: >
      Es ist {time}. Hier ist das aktuelle Wetter für {location}.
      Die Temperatur beträgt {temperature} Grad.
      {weather_description}.
  full_hour:
    enabled: true
    template: >
      Es ist {time}. Hier sind die Wetterdaten für {location}.
      Die Temperatur beträgt {temperature} Grad, gefühlt {apparent_temperature} Grad.
      Die Luftfeuchtigkeit beträgt {humidity} Prozent.
      Der Luftdruck liegt bei {pressure} Hektopascal.
      Der Wind kommt aus {wind_direction} mit {wind_speed} Kilometern pro Stunde.

locations:
  wittstock:
    name: Wittstock
    latitude: 53.16
    longitude: 12.48
    timezone: Europe/Berlin
    language: de
    enabled: true
    weather:
      # Wittstock-Rote Mühle; keine CDC-Stations-ID verwenden.
      dwd_station_id: F143
    # Beispiel für standortspezifische Überschreibungen:
    # announcements:
    #   half_hour:
    #     template: "Es ist {time} in {location}. Die Temperatur: {temperature} Grad."
    # audio:
    #   jingles:
    #     half_hour: assets/wittstock-short.wav
