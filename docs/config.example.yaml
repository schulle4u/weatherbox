# Full configuration example; copy to the project directory as config.yaml
# and customize the model and audio file paths before use.
# For a start without additional files, use config.quickstart.yaml.
application:
  log_level: INFO
  json_logs: false

localization:
  default_language: de
  # Optional directory containing custom or overridden language files.
  # Relative paths are resolved against this configuration file.
  # directory: lang

weather:
  providers:
    open-meteo:
      endpoint: https://api.open-meteo.com/v1/forecast
    dwd:
      endpoint: https://app-prod-ws.warnwetter.de/v30/stationOverviewExtended
  update_interval_minutes: 30
  max_cache_age_minutes: 60
  request_timeout_seconds: 15
  merge:
    tolerance_minutes: 30
    default_priority: [open-meteo, dwd]
    field_priority:
      temperature: [dwd, open-meteo]
      humidity: [dwd, open-meteo]
      pressure: [dwd, open-meteo]
      warnings: [dwd, open-meteo]

scheduler:
  preparation_minutes: 10
  retry:
    interval_seconds: 60
    max_attempts: 5

tts:
  # Cloud speech generation with gTTS and a local Piper fallback.
  # piper and espeak-ng can also be used as the primary or fallback provider.
  provider: gtts
  fallback_provider: piper
  gtts:
    language: de
    tld: de
    slow: false
    timeout_seconds: 15
  piper:
    executable: piper
    model: models/de_DE-kerstin-low.onnx
  espeak-ng:
    executable: espeak-ng
    voice: de
    speed: 155
  # Optional models and voices per language. Missing values use
  # the defaults above.
  # languages:
  #   en:
  #     piper:
  #       model: models/en_GB-alba-medium.onnx
  #     espeak-ng:
  #       voice: en-gb
  #     gtts:
  #       language: en
  #       tld: co.uk

audio:
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  loudness:
    enabled: true
    target_lufs: -16
    true_peak_db: -1.5
    loudness_range: 11
  output:
    sample_rate: 48000
    channels: 2
    # Each key produces its own versioned and public asset.
    formats:
      mp3:
        bitrate: 192k
      # wav: {}
      # flac: {}
      # ogg:
      #   bitrate: 160k
      # opus:
      #   bitrate: 96k
      # m4a:
      #   bitrate: 192k
  jingles:
    # Relative paths are resolved against this configuration file.
    # All three files are optional.
    half_hour:
      intro: assets/jingle-short.wav
      outro: assets/outro.wav
      music: assets/music.wav
    full_hour:
      intro: assets/jingle-full.wav
      outro: assets/outro.wav
      music: assets/music.wav
    # Music bed gain adjustment in dB (must be <= 0).
    music_attenuation: -10
    # Fade-out duration after the speech ends, in seconds.
    music_fade_out: 2.5

output:
  cache_dir: var/cache
  generated_dir: var/generated
  # Delete old generated assets before each regular run. Omit or use null
  # to disable automatic cleanup.
  generated_retention_days: 30
  public_dir: var/public
  state_dir: var/state

# Announcements can be fully overridden per location.
announcements:
  half_hour:
    enabled: true
    template: >
      Es ist {time}. Hier ist das aktuelle Wetter für {location}.
      Die Temperatur beträgt {temperature} Grad.
      {weather_description}.
  full_hour:
    enabled: true
    template: >
      Es ist {time}. Hier sind die Wetterdaten für {location}.
      Die Temperatur beträgt {temperature} Grad, gefühlt {apparent_temperature} Grad.
      Die Luftfeuchtigkeit beträgt {humidity} Prozent.
      Der Luftdruck liegt bei {pressure} Hektopascal.
      Der Wind kommt aus {wind_direction} mit {wind_speed} Kilometern pro Stunde.

locations:
  wittstock:
    name: Wittstock
    latitude: 53.16
    longitude: 12.48
    timezone: Europe/Berlin
    # Temperature unit for announcements: c (Celsius) or f (Fahrenheit).
    temperature_unit: c
    language: de
    enabled: true
    weather:
      # Wittstock-Rote Mühle; do not use a CDC station ID.
      dwd_station_id: F143
    # Example of location-specific overrides:
    # announcements:
    #   half_hour:
    #     template: "Es ist {time} in {location}. Die Temperatur: {temperature} Grad."
    # audio:
    #   jingles:
    #     half_hour:
    #       intro: assets/wittstock-short.wav
    #       music: assets/wittstock-music.wav
